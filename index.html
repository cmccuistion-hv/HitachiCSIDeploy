<!doctype html>
<html lang="en" data-palette="coe" data-mode="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Hitachi CSI Deployment Wizard — configure and generate manifests for the Hitachi CSI stack." />
    <meta name="theme-color" content="#ffffff" />
    <title>Hitachi CSI Deployment Wizard</title>
    <script>
      try {
        var t = JSON.parse(localStorage.getItem('hitachi-csi-wizard-theme') || '{}')
        var palette = t.palette === 'blue' ? 'blue' : 'coe'
        var mode = t.mode === 'dark' ? 'dark' : 'light'
        document.documentElement.dataset.palette = palette
        document.documentElement.dataset.mode = mode
        document.documentElement.style.colorScheme = mode
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
